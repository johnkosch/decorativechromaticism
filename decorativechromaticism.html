// Choose one key once per melody: the entire melody is F, C, G, B-flat, E-flat, D, or A major.
let currentKey = randomChoice(["F", "C", "G", "Bb", "Eb", "D", "A"]);
let config = keyConfigs[currentKey];


// =========================================
// RHYTHM CELLS
//
// No eighth notes in the base skeleton.
// Every measure = 2-beat cell + 2-beat cell.
// The final two beats are always a half note.
// =========================================

const rhythmCells = [
  {
    weight: 5,
    notes: [
      { type: "note", beats: 2, meiDur: 2 }
    ]
  },
  {
    weight: 7,
    notes: [
      { type: "note", beats: 1, meiDur: 4 },
      { type: "note", beats: 1, meiDur: 4 }
    ]
  },
  {
    weight: 2,
    notes: [
      { type: "rest", beats: 1, meiDur: 4 },
      { type: "note", beats: 1, meiDur: 4 }
    ]
  }
];

function randomChoice(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function randomRhythmCell(excludedCell = null) {
  const available = rhythmCells.filter(cell => cell !== excludedCell);
  const totalWeight = available.reduce((sum, cell) => sum + cell.weight, 0);
  let random = Math.random() * totalWeight;

  for (const cell of available) {
    random -= cell.weight;
    if (random <= 0) {
      return {
        source: cell,
        notes: cell.notes.map(note => ({ ...note }))
      };
    }
  }

  const fallback = available[0];
  return {
    source: fallback,
    notes: fallback.notes.map(note => ({ ...note }))
  };
}


// =========================================
// PITCH HELPERS
// =========================================

function diatonicNumber(pitch) {
  return config.diatonicNumbers[pitch];
}

function pitchFromDiatonicNumber(number) {
  return config.pitchNames[number];
}

function chromaticBetween(a, b) {
  const aNum = diatonicNumber(a);
  const bNum = diatonicNumber(b);

  if (aNum === undefined || bNum === undefined) return null;
  if (Math.abs(aNum - bNum) !== 1) return null;

  const key = a + "-" + b;
  return aNum < bNum
    ? (config.chromaticAscending[key] || null)
    : (config.chromaticDescending[key] || null);
}


// =========================================
// BASE PITCH GENERATION
//
// Only the harmonic/chord-tone constraints and
// the existing interval ceiling are used here.
//
// Start/end tonic remain part of this experiment.
// =========================================

function generatePitches(measures) {

  const soundingEvents = [];

  measures.forEach((measure, measureIndex) => {
    for (const event of measure) {
      if (event.type === "note") {
        soundingEvents.push({
          event,
          chord: config.chords[measureIndex]
        });
      }
    }
  });

  function degree(pitch) {
    return diatonicNumber(pitch);
  }

  function candidatesFor(current, chord) {
    return chord.filter(candidate => {
      const distance = Math.abs(degree(candidate) - degree(current));

      // No interval larger than a 4th.
      // In this diatonic scale-number representation:
      //   1 = 2nd, 2 = 3rd, 3 = 4th, 4 = 5th.
      // Therefore a distance of 4 is already too large.
      if (distance > 3) return false;

      // No tritone: scale degree 7 <-> 4.
      if (
        (degree(current) === 6 && degree(candidate) === 3) ||
        (degree(current) === 3 && degree(candidate) === 6)
      ) return false;

      // No 6ths.
      if (distance === 5 || distance === 6) return false;

      return true;
    });
  }

  const result = new Array(soundingEvents.length);

  function search(position, current) {
    if (position === soundingEvents.length - 1) {
      const final = config.tonic;
      const distance = Math.abs(degree(current) - degree(final));
      if (distance <= 3) {
        result[position] = final;
        return true;
      }
      return false;
    }

    if (position === 0) {
      // Begin on any chord tone of the F-major tonic triad:
      // F, A, or C (including the available octave C5).
      const start = randomChoice(config.tonicChoices);
      result[0] = start;
      return search(1, start);
    }

    let candidates = candidatesFor(
      current,
      soundingEvents[position].chord
    );

    candidates = candidates.sort(() => Math.random() - 0.5);

    for (const candidate of candidates) {
      result[position] = candidate;
      if (search(position + 1, candidate)) return true;
    }

    return false;
  }

  for (let attempt = 0; attempt < 200; attempt++) {
    result.fill(null);

    if (search(0, config.tonic)) {
      soundingEvents.forEach((item, i) => {
        item.event.pitch = result[i];
      });
      return;
    }
  }

  throw new Error("Could not find a valid chord-tone skeleton.");
}


// =========================================
// CHROMATIC PASSING-TONE BRUTE FORCE
//
// Exact pattern:
//
//     C - C - D
//
// becomes:
//
//     C - C# - D
//
// The same brute-force rule now works in either
// direction:
//
//     D - D - C  ->  D - C# - C
//
// We look at every three-note sounding string.
// If the first two pitches are identical and the
// third is a diatonic step away, the repeated middle
// pitch is replaced by the chromatic pitch between
// the repeated note and the destination.
//
// For now, this is deliberately literal rather than
// abstract: no candidate lists, no probabilistic
// chromaticism. Just pattern matching.
// =========================================

function addChromaticPassingTones(measures) {

  const sounding = [];

  for (const measure of measures) {
    for (const event of measure) {
      if (event.type === "note") {
        sounding.push(event);
      }
    }
  }

  for (let i = 0; i < sounding.length - 2; i++) {

    const first = sounding[i];
    const middle = sounding[i + 1];
    const third = sounding[i + 2];

    if (
      first.pitch === middle.pitch &&
      diatonicNumber(first.pitch) !== undefined &&
      diatonicNumber(third.pitch) !== undefined
    ) {

      const passing = chromaticBetween(
        first.pitch,
        third.pitch
      );

      if (passing) {
        // Literal three-note transformations. The current
        // candidate set includes:
        //
        // Up:
        //   C-C-D   -> C-C#-D
        //   D-D-E   -> D-D#-E
        //   F-F-G   -> F-F#-G
        //   G-G-A   -> G-G#-A
        //   A-A-B   -> A-A#-B
        //
        // Down:
        //   D-D-C   -> D-Db-C
        //   E-E-D   -> E-Eb-D
        //   G-G-F   -> G-Gb-F
        //   A-A-G   -> A-Ab-G
        //   B-B-A   -> B-Bb-A
        //
        // This remains deliberately brute-force rather
        // than using a generalized chromaticism model.
        middle.pitch = passing;
        middle.isChromaticPassing = true;
      }
    }
  }
}


// =========================================
// DIATONIC PASSING TONES
//
// Fill eligible quarter-note 3rds:
// C-E -> C-D-E
// G-E -> G-F-E
//
// This is kept after the chromatic pattern pass
// so the new chromatic notes are not immediately
// reinterpreted by the diatonic layer.
// =========================================

function fillThirdsWithPassingTones(measures) {

  for (const measure of measures) {

    const result = [];

    for (let i = 0; i < measure.length; i++) {

      const current = measure[i];
      const next = measure[i + 1];

      if (
        current.type === "note" &&
        next &&
        next.type === "note" &&
        !current.isChromaticPassing &&
        !next.isChromaticPassing &&
        current.beats === 1 &&
        next.beats === 1
      ) {

        const a = diatonicNumber(current.pitch);
        const b = diatonicNumber(next.pitch);

        if (Math.abs(a - b) === 2) {

          const middle = pitchFromDiatonicNumber(
            (a + b) / 2
          );

          result.push({
            type: "note",
            pitch: current.pitch,
            beats: 0.5,
            meiDur: 8
          });

          result.push({
            type: "note",
            pitch: middle,
            beats: 0.5,
            meiDur: 8
          });

          result.push({
            type: "note",
            pitch: next.pitch,
            beats: 1,
            meiDur: 4
          });

          i++;
          continue;
        }
      }

      result.push(current);
    }

    measure.length = 0;
    measure.push(...result);
  }
}


// =========================================
// NEIGHBOR TONES
//
// Repeated quarter notes:
//
//     C - C
//
// become:
//
//     C - D - C
//
// with EIGHTH + EIGHTH + QUARTER.
// =========================================

function addNeighborToRepeatedPitches(measures) {

  for (const measure of measures) {

    const result = [];

    for (let i = 0; i < measure.length; i++) {

      const current = measure[i];
      const next = measure[i + 1];

      if (
        current.type === "note" &&
        next &&
        next.type === "note" &&
        current.pitch === next.pitch &&
        current.beats === 1 &&
        next.beats === 1
      ) {

        const number = diatonicNumber(current.pitch);
        const choices = [];

        if (number > 0) choices.push(number - 1);
        if (number < 7) choices.push(number + 1);

        const neighbor = pitchFromDiatonicNumber(
          randomChoice(choices)
        );

        result.push({
          type: "note",
          pitch: current.pitch,
          beats: 0.5,
          meiDur: 8
        });

        result.push({
          type: "note",
          pitch: neighbor,
          beats: 0.5,
          meiDur: 8
        });

        result.push({
          type: "note",
          pitch: next.pitch,
          beats: 1,
          meiDur: 4
        });

        i++;
        continue;
      }

      result.push(current);
    }

    measure.length = 0;
    measure.push(...result);
  }
}


// =========================================
// COMPLETE MELODY
// =========================================

function createRandomMelody() {

  currentKey = randomChoice(["F", "C", "G", "Bb", "Eb", "D", "A"]);
  config = keyConfigs[currentKey];

  // Keep generating until the chromatic pattern matcher
  // actually produces at least one chromatic passing tone.
  for (let attempt = 0; attempt < 500; attempt++) {

    const measures = [];
    let previousCell = null;

    // -----------------------------------------
    // Generate rhythm.
    // -----------------------------------------

    for (let measureNumber = 0; measureNumber < 4; measureNumber++) {

      const firstChoice = randomRhythmCell(previousCell);
      const firstCell = firstChoice.notes;
      previousCell = firstChoice.source;

      let secondCell;

      if (measureNumber === 3) {

        secondCell = [
          {
            type: "note",
            beats: 2,
            meiDur: 2
          }
        ];

      } else {

        const secondChoice = randomRhythmCell(previousCell);
        secondCell = secondChoice.notes;
        previousCell = secondChoice.source;
      }

      measures.push([
        ...firstCell,
        ...secondCell
      ]);
    }

    // -----------------------------------------
    // Generate the diatonic chord-tone skeleton.
    // -----------------------------------------

    generatePitches(measures);

    // The skeleton generator now chooses the opening pitch
    // from the tonic triad (F, A, or C) and resolves to F.
    // No post-generation pitch override is needed here.

    // -----------------------------------------
    // Apply the chromatic pattern matcher.
    // -----------------------------------------

    addChromaticPassingTones(measures);

    // -----------------------------------------
    // Did we actually get chromaticism?
    //
    // Do NOT proceed to the other embellishment
    // layers until we know this melody qualifies.
    // -----------------------------------------

    const hasChromaticism = measures.some(measure =>
      measure.some(event =>
        event.type === "note" &&
        event.isChromaticPassing === true
      )
    );

    if (!hasChromaticism) {
      continue;
    }

    // Existing diatonic embellishment layers.
    fillThirdsWithPassingTones(measures);
    addNeighborToRepeatedPitches(measures);

    return measures;
  }

  throw new Error(
    "Could not generate a melody containing chromaticism."
  );
}


// =========================================
// MEI / VEROVIO
// =========================================

function pitchToMEI(pitch) {
  const match = pitch.match(/^([a-g])(#|##|b)?(\d)$/);

  const pname = match[1];
  const writtenAccidental = match[2] || null;
  const oct = match[3];

  // Suppress accidentals that are already supplied by the key signature,
  // while explicitly marking a natural that cancels the key signature.
  let accid = writtenAccidental;

  const keySignatureAccidentals =
    currentKey === "G" ? { f: "#" } :
    currentKey === "D" ? { f: "#", c: "#" } :
    currentKey === "A" ? { f: "#", c: "#", g: "#" } :
    currentKey === "F" ? { b: "b" } :
    currentKey === "Bb" ? { b: "b", e: "b" } :
    currentKey === "Eb" ? { b: "b", e: "b", a: "b" } :
    {};

  if (Object.prototype.hasOwnProperty.call(keySignatureAccidentals, pname)) {
    const expected = keySignatureAccidentals[pname];
    if (writtenAccidental === expected) {
      accid = null;
    } else if (writtenAccidental === null) {
      accid = "n";
    }
  }

  return { pname, accid, oct };
}

function makeEvent(event) {

  if (event.type === "rest") {
    return `<rest dur="${event.meiDur}"/>`;
  }

  const pitch = pitchToMEI(event.pitch);

  const accidental =
    pitch.accid
      ? ` accid="${pitch.accid === "##" ? "ss" : pitch.accid === "#" ? "s" : pitch.accid === "b" ? "f" : "n"}"`
      : "";

  return `
    <note
      pname="${pitch.pname}"
      oct="${pitch.oct}"
      dur="${event.meiDur}"${accidental}
    />
  `;
}

function renderCell(cell) {

  let output = "";
  let i = 0;

  while (i < cell.length) {

    const event = cell[i];
    const next = cell[i + 1];

    if (
      event.type === "note" &&
      event.beats === 0.5 &&
      next &&
      next.type === "note" &&
      next.beats === 0.5
    ) {

      output += `
        <beam>
          ${makeEvent(event)}
          ${makeEvent(next)}
        </beam>
      `;

      i += 2;
      continue;
    }

    output += makeEvent(event);
    i++;
  }

  return output;
}

function transposePitchByOctaves(pitch, octaveOffset) {
  return pitch.replace(/(\d)$/, (_, octave) => String(Number(octave) + octaveOffset));
}

function melodyForCurrentClef(measures) {
  // Treble is the original register, except B-flat major melodies
  // are placed one octave lower. Bass remains two octaves below
  // the original treble register for every key.
  const octaveOffset =
    clefMode === "bass" && currentKey === "C" ? -1 :
    clefMode === "bass" ? -2 :
    currentKey === "Bb" ? -1 :
    0;

  if (octaveOffset === 0) {
    return measures;
  }

  return measures.map(measure =>
    measure.map(event => {
      if (event.type !== "note") return { ...event };
      return {
        ...event,
        pitch: transposePitchByOctaves(event.pitch, octaveOffset)
      };
    })
  );
}

function melodyToMEI(measures) {

  let measureMarkup = "";

  measures.forEach((measure, index) => {

    let firstCell = [];
    let secondCell = [];
    let beats = 0;

    for (const event of measure) {

      if (beats < 2) {
        firstCell.push(event);
      } else {
        secondCell.push(event);
      }

      beats += event.beats;
    }

    measureMarkup += `
      <measure n="${index + 1}">
        <staff n="1">
          <layer n="1">
            ${renderCell(firstCell)}
            ${renderCell(secondCell)}
          </layer>
        </staff>
      </measure>
    `;
  });

  return `
    <?xml version="1.0" encoding="UTF-8"?>

    <mei
      xmlns="http://www.music-encoding.org/ns/mei"
      meiversion="5.0">

      <music>
        <body>
          <mdiv>
            <score>

              <scoreDef
                meter.count="4"
                meter.unit="4"
                key.sig="${config.keySig}"
                key.mode="major">

                <staffGrp>
                  <staffDef
                    n="1"
                    lines="5"
                    clef.shape="${clefMode === "treble" ? "G" : "F"}"
                    clef.line="${clefMode === "treble" ? "2" : "4"}"
                  />
                </staffGrp>

              </scoreDef>

              <section>
                ${measureMarkup}
              </section>

            </score>
          </mdiv>
        </body>
      </music>
    </mei>
  `;
}


// =========================================
// GENERATE + RENDER
// =========================================

function generateMelody() {

  try {

    currentMelody = createRandomMelody();
    console.log("Generated melody:", currentMelody);

    const mei = melodyToMEI(melodyForCurrentClef(currentMelody));
    console.log("MEI:", mei);

    const svg = toolkit.renderData(mei, {});

    document.getElementById("notation").innerHTML = svg;

  } catch (error) {

    console.error(error);

    document.getElementById("notation").innerHTML =
      "<p>There was an error generating the melody. Check the browser console.</p>";
  }
}

document
  .getElementById("generate")
  .addEventListener("click", generateMelody);

document.querySelectorAll('input[name="clef"]').forEach(radio => {
  radio.addEventListener("change", event => {
    clefMode = event.target.value;
    if (currentMelody) {
      try {
        const mei = melodyToMEI(melodyForCurrentClef(currentMelody));
        const svg = toolkit.renderData(mei, {});
        document.getElementById("notation").innerHTML = svg;
      } catch (error) {
        console.error(error);
        document.getElementById("notation").innerHTML =
          "<p>There was an error rendering the selected clef. Check the browser console.</p>";
      }
    }
  });
});
